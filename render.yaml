# Render Blueprint — free backend deploy. Connect this repo on render.com.
# Render builds backend/Dockerfile and injects $PORT automatically.
services:
  - type: web
    name: careerai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: CAREER_AI_ENV
        value: production
      - key: CAREER_AI_SECRET
        generateValue: true
      - key: CAREER_AI_ADMIN_TOKEN
        generateValue: true
      # Set to your deployed frontend URL once it exists (no trailing slash).
      - key: CAREER_AI_CORS_ORIGINS
        value: https://careerai.pages.dev
      - key: CAREER_AI_SCHEDULER
        value: "0"
      - key: ADMIN_EMAIL
        value: bancmaha@gmail.com
